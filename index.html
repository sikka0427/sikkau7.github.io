<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story | For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ff8fa3;
            --bg: #fff5f7;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Floating Hearts Animation Background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .story-container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
            text-align: center;
            position: relative;
            border: 2px solid #ffe0e6;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .story-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
            min-height: 100px;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .next-btn:hover {
            background-color: #ffb3c1;
            color: var(--primary);
            transform: translateY(-2px);
        }

        .heart-icon {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="hearts-bg" id="heartsBg"></div>

    <div class="story-container">
        <span class="heart-icon">❤️</span>
        <h1 id="title">Our Story</h1>
        <p class="story-text" id="storyContent">
            Every moment with you feels like a beautiful dream...
        </p>
        <button class="next-btn" onclick="nextPage()">Next Chapter ✨</button>
    </div>

    <script>
        // Story Lines - Aap inhe yahan se change kar sakte hain
        const stories = [
            "It all started with a simple hello, but little did I know you'd become my whole world.",
            "I cherish every laugh we've shared and every memory we've made together.",
            "You are the best thing that ever happened to me, and I'm so lucky to have you.",
            "So, will you continue this beautiful journey with me, forever?"
        ];

        let currentStep = 0;

        function nextPage() {
            const content = document.getElementById('storyContent');
            const title = document.getElementById('title');
            
            if (currentStep < stories.length) {
                content.style.opacity = 0;
                setTimeout(() => {
                    content.innerText = stories[currentStep];
                    content.style.opacity = 1;
                    currentStep++;
                }, 300);
            } else {
                title.innerText = "I Love You! ❤️";
                content.innerText = "Thank you for being part of my story.";
                document.querySelector('.next-btn').style.display = 'none';
            }
        }

        // Falling Hearts Effect
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.color = '#ff4d6d';
            heart.style.opacity = Math.random();
            heart.style.zIndex = '-1';
            heart.style.transition = 'transform 5s linear, opacity 5s';
            
            document.getElementById('heartsBg').appendChild(heart);

            setTimeout(() => {
                heart.style.transform = `translateY(110vh) rotate(${Math.random() * 360}deg)`;
            }, 100);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
